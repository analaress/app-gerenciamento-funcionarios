<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestão de Funcionários</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1rem;
            background: #f5f7fb;
            color: #18212f
        }

        nav {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem
        }

        a,
        button {
            background: #2563eb;
            color: white;
            border: 0;
            border-radius: 6px;
            padding: .65rem 1rem;
            text-decoration: none;
            cursor: pointer
        }

        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
            box-shadow: 0 2px 8px #0001
        }

        th,
        td {
            padding: .8rem;
            border-bottom: 1px solid #e5e7eb;
            text-align: left
        }

        form {
            background: white;
            padding: 1.5rem;
            border-radius: 8px;
            display: grid;
            gap: 1rem;
            max-width: 600px
        }

        input,
        select {
            padding: .7rem;
            border: 1px solid #cbd5e1;
            border-radius: 5px
        }

        label {
            display: grid;
            gap: .35rem
        }

        .badge {
            color: #166534;
            background: #dcfce7;
            padding: .2rem .5rem;
            border-radius: 10px
        }
    </style>
</head>

<body>
    <nav><a href="/painel">Painel</a><a href="/painel/colaboradores">Colaboradores</a><a
            href="/painel/emails">E-mails</a></nav>{% block content %}{% endblock %}
</body>

</html>
