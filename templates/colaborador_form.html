{% extends "base.html" %}{% block content %}

<h1>Novo colaborador</h1>
<form method="post" action="/ui/colaboradores"><label>Empresa<select name="empresa_id" required>{% for e in empresas %}
            <option value="{{ e.id }}">{{ e.nome }}</option>{% endfor %}</select></label><label>Nome<input name="nome"
            required></label><label>E-mail<input type="email" name="email" required></label><label>Cargo<input
            name="cargo" required></label><label>Salário<input type="number" step="0.01" min="0" name="salario"
            required></label><button type="submit">Salvar colaborador</button></form>{% endblock %}
